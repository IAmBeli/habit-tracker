{% extends "habits/base.html" %}

{% block title %}Confirm deletion of habit{% endblock %}

{% block content %}
<h1>Delete habit?</h1>

<p class="warning">
    You are about to delete <strong>{{ habit.title }}</strong>
    and all {{ habit.completions.count }} completion records.
    This cannot be undone.
</p>

<form method="post">
    {% csrf_token %}
    <div class="form-actions">
        <button type="submit" class="button danger-solid">Delete</button>
        <a href="{% url 'habit_list' %}" class="button">Cancel</a>
    </div>
</form>
{% endblock %}
