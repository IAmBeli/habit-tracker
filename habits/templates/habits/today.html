{% extends "habits/base.html" %}

{% block title %}Today{% endblock %}

{% block content %}
<h1>{{ date }}</h1>

<div class="cards">
{% for item in items %}
    <div class="card">
        <div class="card-title">{{ item.habit.title }}</div>
        {% if item.streak > 0 %}
            <div class="card-meta">streak: {{ item.streak }}</div>
        {% endif %}
        <form method="post" action="{% url 'toggle' item.habit.id %}">
            {% csrf_token %}
            <button type="submit" class="card-button {% if item.is_done %}done{% endif %}">
                {% if item.is_done %}Done ✓{% else %}Mark done{% endif %}
            </button>
        </form>
    </div>
{% empty %}
    <p>Nothing due today</p>
{% endfor %}
</div>
{% endblock %}
