{% extends "habits/base.html" %}

{% block title %}Pauses{% endblock %}

{% block content %}
<div class="page-head">
    <h1>Pauses</h1>
    <a href="{% url 'create_pause' %}" class="button">Add pause</a>
</div>
<div class="rows">
{% for pause in pauses %}
    <div class="row">
        <div class="row-main">
            <div class="row-title">
                {{ pause.start_date|date:"j F Y" }} - {{ pause.end_date|date:"j F Y" }}
            </div>
            <div class="row-meta">{{ pause.reason }}</div>
        </div>

        <div class="row-actions">
            <a href="{% url 'delete_pause' pause.id %}" class="button danger">Delete</a>
        </div>
    </div>
{% empty %}
    <p>No pauses.</p>
{% endfor %}
</div>
{% endblock %}
