{% extends "habits/base.html" %}

{% block title %}New pause{% endblock %}

{% block content %}
<h1>New pause</h1>

<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="form-actions">
        <button type="submit" class="button primary">Create</button>
        <a href="{% url 'pause_list' %}" class="button">Cancel</a>
    </div>
</form>
{% endblock %}
