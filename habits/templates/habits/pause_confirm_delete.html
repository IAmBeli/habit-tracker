{% extends "habits/base.html" %}

{% block title %}Confirm delition of pause{% endblock %}

{% block content %}
<h1>Delete pause?</h1>

<p class="warning">
    You are about to delete this pause.
    This can't be undone.
</p>

<form method="post">
    {% csrf_token %}
    <div class="form-actions">
        <button type="submit" class="button danger-solid">Delete</button>
        <a href="{% url 'pause_list' %}">Cancel</a>
    </div>
</form>
{% endblock %}
